name: Lighthouse CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout site files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start local static server
        run: |
          npx --yes http-server . -p 8080 &
          npx --yes wait-on http://127.0.0.1:8080

      - name: Run Lighthouse as advisory check
        uses: treosh/lighthouse-ci-action@v9
        continue-on-error: true
        with:
          urls: |
            http://127.0.0.1:8080/
            http://127.0.0.1:8080/client-portal.html
          uploadArtifacts: true
          temporaryPublicStorage: true
