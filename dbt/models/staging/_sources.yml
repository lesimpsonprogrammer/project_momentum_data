version: 2

sources:
  - name: momentum_data
    schema: public
    tables:
      - name: client_onboarding_submissions
        description: >
          Raw onboarding form submissions. Contains sensitive tax/banking
          references and an encrypted sensitive payload — those columns are
          intentionally excluded from staging and marts.
        loaded_at_field: submitted_at
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: client_reference
            tests:
              - unique
              - not_null
